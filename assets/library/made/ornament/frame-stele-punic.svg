<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 400" width="240" height="400">
<title>Punic votive stele</title>
<desc>A pointed Punic stele with the sign of Tanit in the gable, the shape of the votive stones from the tophets of Carthage and Motya (general knowledge, not a copy of one stone). For Carthaginian news and treaties.</desc>
