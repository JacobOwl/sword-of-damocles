<title>Carthage (Siculo-Punic) coin, horse</title>
<desc>A Punic-style coin with a game icon as its badge. Carthage's first coins (about 410 to 390 BC) bore a horse and a date palm (checked: docs/research/art-motifs.md, from a saved Wikipedia page). The drawing is invention. No legend.</desc>
