<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>The Story Museum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: a museum's printed catalogue. Two shelves of numbered plates (the best and the dullest reigns);
   opening a plate turns to its bound chronicle, with the curator's label first and the reign after.
   Single light theme by choice (Jacob: parchment, no dark mode). Built by scripts/museum.ts from this template. */
:root {
  --page: #efe4c8; --panel: #e6d7b0; --ink: #2b1d12; --muted: #5a4733; --rule: #c9b78a;
  --accent: #7a5424; --gold: #b8913a; --olive: #28603f; --blood: #8e2a1c; --glaze: #1d1410;
  --display: "IM Fell English SC", Georgia, serif;
  --body: "IM Fell DW Pica", Georgia, "Times New Roman", serif;
  --num: "Cormorant Garamond", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--ink); }
body { margin: 0; font-family: var(--body); font-size: 17px; line-height: 1.5;
  background-image: radial-gradient(rgba(120, 85, 40, .08) 1px, transparent 1.3px); background-size: 7px 7px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.12; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: .04em; }
h2 { font-size: 1.4rem; letter-spacing: .04em; padding-bottom: 6px; background: linear-gradient(var(--rule), var(--rule)) 0 calc(100% - 3px) / 100% 1px no-repeat, linear-gradient(var(--rule), var(--rule)) 0 100% / 100% 1px no-repeat; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--display); font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); max-width: 64ch; margin-top: 8px; }
.tesserae { height: 8px; background: repeating-linear-gradient(90deg, #c8743a 0 6px, var(--page) 6px 7px, var(--glaze) 7px 13px, var(--page) 13px 14px, var(--gold) 14px 20px, var(--page) 20px 21px, var(--glaze) 21px 27px, var(--page) 27px 28px); opacity: .85; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 36px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: 12px; }
.fact b { display: block; font-family: var(--num); font-size: 2rem; font-weight: 600; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.fact span { font-size: .9rem; color: var(--muted); }
.shelf { display: grid; gap: 12px; }
.shelf > p { color: var(--muted); max-width: 64ch; }
.plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 28px; }
.plate { display: grid; grid-template-columns: 2.6rem 1fr; gap: 12px; padding-block: 14px; border-top: 1px solid var(--rule); text-decoration: none; color: inherit; }
.plate:hover h3 { color: var(--accent); }
.plate .no { font-family: var(--num); font-size: 1.5rem; font-weight: 600; color: var(--accent); line-height: 1; padding-top: 2px; }
.plate.dull .no { color: var(--muted); }
.plate small { display: block; color: var(--muted); font-size: .88rem; margin-top: 3px; }
.score { font-family: var(--num); font-weight: 600; font-variant-numeric: tabular-nums; }
.index { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 6px 28px; }
.index div { display: grid; grid-template-columns: 1fr 3.2rem; gap: 2px 10px; align-items: baseline; padding-block: 6px; border-top: 1px dotted var(--rule); }
.index .nm { min-width: 0; }
.index .sh { font-family: var(--num); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.index .bar { grid-column: 1 / -1; height: 3px; background: var(--panel); }
.index .bar i { display: block; height: 100%; background: var(--olive); }
.index .dull .bar i { background: var(--blood); }
.index .never .sh { color: var(--muted); font-style: italic; }
.index small { grid-column: 1 / -1; color: var(--muted); font-size: .86rem; }
/* The bound chronicle */
.book { display: grid; gap: 22px; }
.back { font-family: var(--display); letter-spacing: .06em; }
.label { border: 1px solid var(--rule); background: color-mix(in srgb, var(--panel) 55%, var(--page)); padding: 16px 18px; display: grid; gap: 12px; }
.label .meta { color: var(--muted); font-size: .92rem; }
.found { display: grid; gap: 10px; }
.found .f { display: grid; grid-template-columns: 1.6rem 1fr; gap: 8px; }
.found .w { font-family: var(--num); font-weight: 600; text-align: right; color: var(--olive); font-variant-numeric: tabular-nums; }
.found .f.dull .w { color: var(--blood); }
.found blockquote { margin: 4px 0 0; padding-left: 10px; border-left: 2px solid var(--rule); color: var(--muted); font-size: .94rem; }
.found blockquote span { font-family: var(--display); font-size: .8rem; letter-spacing: .06em; color: var(--accent); margin-right: 6px; }
.ending { font-style: italic; font-size: 1.08rem; max-width: 66ch; }
.year { border-top: 1px solid var(--rule); padding-block: 10px; }
.year > summary { cursor: pointer; font-family: var(--display); font-size: 1.1rem; letter-spacing: .04em; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.year > summary::-webkit-details-marker { display: none; }
.year > summary::after { content: "＋"; color: var(--accent); }
.year[open] > summary::after { content: "－"; }
.season { display: grid; gap: 6px; margin-top: 12px; max-width: 68ch; }
.season h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: .95rem; letter-spacing: .08em; color: var(--accent); }
.omens { font-style: italic; color: var(--muted); font-size: .94rem; }
.lives { display: grid; gap: 10px; max-width: 68ch; }
.lives p b { font-family: var(--display); font-weight: 400; letter-spacing: .03em; }
.key { color: var(--muted); font-size: .85rem; border-top: 1px solid var(--rule); padding-top: 10px; }
@media (max-width: 520px) { body { font-size: 16px; } .fact b { font-size: 1.6rem; } }
@media (prefers-reduced-motion: no-preference) { .book { animation: turn .35s ease-out; } @keyframes turn { from { opacity: .4; transform: translateY(6px); } } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = /*MUSEUM_DATA*/null;
const app = document.getElementById("app");
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const pct = (x) => `${Math.round(100 * x)}%`;

function plates(list, dull) {
  return `<div class="plates">${list.map((b) => `<a class="plate${dull ? " dull" : ""}" href="#${b.shelf}-${b.rank}">
    <span class="no">${ROMAN[b.rank]}</span>
    <div><h3>${esc(b.title)}</h3><small>Played by ${esc(b.player)}. ${b.over ? `${esc(b.ending.split(". ")[0].replace(/\.$/, ""))}, ${esc(b.over)}.` : ""} Score <span class="score">${b.score}</span>.</small></div></a>`).join("")}</div>`;
}

function hall() {
  const st = DATA.stats;
  const shapes = st.shapes.slice().sort((a, b) => (a.dull - b.dull) || (b.share - a.share));
  app.innerHTML = `
  <header>
    <div class="eyebrow">The Workshop · The Sword of Damocles</div>
    <h1>The Story Museum</h1>
    <p class="lede">Bots played ${st.games.toLocaleString("en")} island games under the rules of your first island test. Each reign was read for the shapes of a story you might retell, and scored. Here are the ten that read best and the ten that read worst, bound as their chronicles.</p>
  </header>
  <div class="tesserae" aria-hidden="true"></div>
  <div class="facts">
    <div class="fact"><b>${st.games.toLocaleString("en")}</b><span>reigns played</span></div>
    <div class="fact"><b>${st.players.length}</b><span>kinds of player: ${esc(st.players.join(", "))}</span></div>
    <div class="fact"><b>${pct(st.tenShare)}</b><span>reach a story shape within ten seasons</span></div>
  </div>
  <section class="shelf"><h2>The ten best</h2><p>Reigns where friends turned, warnings were heeded or not, and the war came home.</p>${plates(DATA.shelves.best, false)}</section>
  <section class="shelf"><h2>The ten dullest</h2><p>Reigns that end too soon, go quiet for years, or tell the same quarrel over and over. These show what to fix.</p>${plates(DATA.shelves.dullest, true)}</section>
  <section class="shelf"><h2>What the museum looks for</h2><p>Each shape is a pattern in a game's record. The bar shows how many reigns had it. Red ones count against a story. None of this is a target for the rules.</p>
    <div class="index">${shapes.map((s) => `<div class="${s.dull ? "dull" : ""}${s.share ? "" : " never"}"><span class="nm">${esc(s.name)}</span><span class="sh">${s.share ? pct(s.share) : "never"}</span><span class="bar"><i style="width:${Math.max(s.share ? 1 : 0, Math.round(100 * s.share))}%"></i></span><small>${esc(s.line)}</small></div>`).join("")}</div>
  </section>
  <p class="key">Every sentence in a chronicle comes from the game's own record, in the order it happened. Nothing is written by hand.</p>`;
  window.scrollTo(0, 0);
}

function book(b) {
  const years = [];
  b.seasons.forEach((x, i) => { const y = Math.floor(i / 4); (years[y] ??= []).push(x); });
  const yearName = (xs) => xs.length > 1 ? `${xs[0].name} to ${xs[xs.length - 1].name}` : xs[0].name;
  const found = b.shapes.filter((f) => !f.dull).concat(b.shapes.filter((f) => f.dull));
  app.innerHTML = `<article class="book">
    <a class="back" href="#">‹ Back to the museum</a>
    <header><div class="eyebrow">${b.shelf === "best" ? "Among the best" : "Among the dullest"}, plate ${ROMAN[b.rank]}</div><h1>${esc(b.title)}</h1></header>
    <section class="label">
      <p class="meta">Played by ${esc(b.player)}. Story score <span class="score">${b.score}</span>, of which <span class="score">${b.ten}</span> in the first ten seasons.</p>
      <p class="ending">${esc(b.ending)}</p>
      <h3>Why it scored this way</h3>
      <div class="found">${found.length ? found.map((f) => `<div class="f${f.dull ? " dull" : ""}"><span class="w">${f.weight > 0 ? "+" : ""}${f.weight}</span><div><b>${esc(f.name)}</b>${f.who ? `, ${esc(f.who)}` : ""}, ${esc(f.when)}.
        <blockquote>${f.evidence.map((e) => `<div>${e.when ? `<span>${esc(e.when)}</span>` : ""}${esc(e.text)}</div>`).join("")}</blockquote></div></div>`).join("") : "<p>No shape was found in this reign.</p>"}</div>
    </section>
    ${b.lives.length ? `<section class="lives"><h2>The people in it</h2>${b.lives.slice(0, 6).map((l) => `<p><b>${esc(l.name)}.</b> ${esc(l.text)}</p>`).join("")}</section>` : ""}
    <section><h2>The chronicle</h2>
      ${years.map((xs, y) => `<details class="year"${y === 0 ? " open" : ""}><summary><span>${esc(yearName(xs))}</span></summary>
        ${xs.map((x) => `<div class="season"><h4>${esc(x.name)}</h4>${x.p.map((p) => `<p>${esc(p)}</p>`).join("")}${x.omens.length ? `<p class="omens">${esc(x.omens.join(" "))}</p>` : ""}</div>`).join("")}
      </details>`).join("")}
    </section>
    <p class="key">To replay this reign exactly: seed ${b.seed}, island scenario, the first island test rules, played by ${esc(b.player)}.</p>
  </article>`;
  window.scrollTo(0, 0);
}

function route() {
  const m = /^#(best|dullest)-(\d+)$/.exec(location.hash);
  const b = m && DATA.shelves[m[1]][Number(m[2]) - 1];
  if (b) book(b); else hall();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
