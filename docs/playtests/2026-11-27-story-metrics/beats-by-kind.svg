<title id="t">Beats per game, by kind: lively games against dull ones</title>
<desc id="d">For each of the eight kinds of beat, the average number per game in the lively quarter (150 games) and the dull quarter (150 games). A man climbs to rival or pretender: 6.39 against 2.58. A seat lost and won back: 2.37 against 0.98. A friend or kinsman turns plotter: 2.55 against 1.01. A reversal: 4.97 against 2.52. A named death: 5.97 against 2.76. A warning that came true: 0.74 against 0.58. A war begun and ended: 0.33 against 0.17. An exile and a return: 0.15 against 0.13.</desc>
<rect class="bg" width="760" height="480"/>
<text class="t1" x="24" y="32" font-size="17" font-weight="600">Beats per game, by kind: lively games against dull ones</text>
<text class="t2" x="24" y="54" font-size="13">For each player, the quarter of its games with the most beats and the quarter with the fewest,</text>
<text class="t2" x="24" y="71" font-size="13">150 games each. Second island test, 30 seasons.</text>
